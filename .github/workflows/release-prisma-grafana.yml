name: Release Prisma Grafana

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push Image to ECR'
        required: true
        default: false
        type: boolean
      overrideTag:
        description: 'Override the image tag'
        type: string
        required: false
        default: ''

env:
  FORCE_COLOR: "1"
  DOCKER_REPOSITORY: dashboards/grafana-prisma-power

jobs:
  build:
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    runs-on: ubuntu-latest
      
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Set image tag from Git tag
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${{ github.event.release.tag_name }}
          echo "IMAGE_TAG=${TAG#v}" >> "$GITHUB_ENV"

      - name: Set image tag from short Git Sha
        if: github.event_name != 'release' || !startsWith(github.ref, 'refs/tags/v')
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Override image tag
        if: github.event_name == 'workflow_dispatch' && inputs.overrideTag != ''
        run: echo "IMAGE_TAG=${{ inputs.overrideTag }}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE_ARN }}
          role-session-name: github-action-grafana-release
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1
        with:
          registries: ${{ vars.AWS_ECR_ACCOUNT_ID }}

      - name: Build and push image to Amazon ECR
        if: github.event_name == 'release' || inputs.push
        run: make build-docker-full PLATFORM=linux/amd64,linux/arm64
        env:
          DOCKER_TAG: ${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}
          DOCKER_BUILD_ARGS: --push

      - name: Build image (no push)
        if: github.event_name != 'release' && !inputs.push
        run: make build-docker-full PLATFORM=linux/amd64,linux/arm64
